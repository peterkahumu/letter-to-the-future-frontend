<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Letter to the Future">
  <title>Letter to the Future</title>
  <!-- Full-bleed tile: keeps the mark legible on light and dark tab strips
       without needing a prefers-color-scheme swap. -->
  <rect width="32" height="32" rx="7" fill="#0a7d73"/>
  <!-- Envelope, sitting high and left to leave the corner for the badge. -->
  <rect x="3.8" y="7.2" width="22.4" height="14.6" rx="2.4" fill="#ffffff"/>
  <path d="M5.2 8.7 L15 16.4 L24.8 8.7" fill="none" stroke="#0a7d73"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Clock badge. At 16px it collapses to a dot and reads as a wax seal;
       from 32px up the hands resolve. The white ring keeps it off the
       envelope edge at every size. -->
  <circle cx="23.9" cy="22.1" r="6.6" fill="#ffffff"/>
  <circle cx="23.9" cy="22.1" r="5.3" fill="#0a7d73"/>
  <path d="M23.9 22.1 L23.9 18.7 M23.9 22.1 L26.7 22.1" fill="none" stroke="#ffffff"
        stroke-width="1.7" stroke-linecap="round"/>
</svg>
